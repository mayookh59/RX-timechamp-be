version: "3.9"

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trackme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trackme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackme_secret}
      POSTGRES_DB: ${POSTGRES_DB:-trackme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trackme}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trackme-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: trackme-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trackme_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-trackme_minio_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket initialization ────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: trackme-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set trackme http://minio:9000 $${MINIO_ROOT_USER:-trackme_minio} $${MINIO_ROOT_PASSWORD:-trackme_minio_secret};
      mc mb --ignore-existing trackme/trackme-screenshots;
      mc mb --ignore-existing trackme/trackme-backups;
      mc anonymous set none trackme/trackme-screenshots;
      mc anonymous set none trackme/trackme-backups;
      exit 0;
      "

  # ── FastAPI Backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackme-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trackme}:${POSTGRES_PASSWORD:-trackme_secret}@postgres:5432/${POSTGRES_DB:-trackme}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: trackme-screenshots
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-trackme_minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-trackme_minio_secret}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health/live'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Celery Worker ──────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackme-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trackme}:${POSTGRES_PASSWORD:-trackme_secret}@postgres:5432/${POSTGRES_DB:-trackme}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: trackme-screenshots
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-trackme_minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-trackme_minio_secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (Scheduler) ────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackme-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trackme}:${POSTGRES_PASSWORD:-trackme_secret}@postgres:5432/${POSTGRES_DB:-trackme}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # ── Nginx Reverse Proxy ────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: trackme-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./dashboard/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
